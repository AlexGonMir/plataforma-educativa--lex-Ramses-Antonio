<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide:wght@400&display=swap" />
  </head>
  <body>
    <div class="contacte">

      <header class="header">
        <div class="header2">
          <div class="logo">
            <a href="../home/index.html">
              <img class="logo-icon" loading="lazy" alt="Monlau" src="../img/Logo.png" />
            </a>
          </div>
          <a class="nav-link" href="../cursos/cursos.html">Cursos</a>
          <a class="nav-link" href="../novetats/novetats.html">Novetats</a>
          <a class="nav-link" href="../about us/aboutus.html">About Us</a>
          <a class="nav-link" href="../home/index.html">Home</a>
          <!-- Contacte omès: és la pàgina actual -->
        </div>
      </header>

      <main class="main-content">

        <div class="page-heading">
          <h1 class="contactans">Contacta'ns</h1>
          <p class="tens-algun-dubte">Tens algun dubte?</p>
        </div>

        <form class="form-body" id="contactForm">
          <div class="left-fields">
            <div class="field-group">
              <label class="field-label" for="nom">Nom:</label>
              <input class="field-input" type="text" id="nom" name="nom" placeholder="El teu nom" />
            </div>
            <div class="field-group">
              <label class="field-label" for="correu">Correu:</label>
              <input class="field-input" type="email" id="correu" name="correu" placeholder="El teu correu" />
            </div>
            <div class="field-group">
              <label class="field-label" for="telefon">Telèfon:</label>
              <input class="field-input" type="tel" id="telefon" name="telefon" placeholder="El teu telèfon" />
            </div>
          </div>
          <div class="right-fields">
            <div class="field-group field-group--full">
              <label class="field-label" for="missatge">Text:</label>
              <textarea class="field-input field-textarea" id="missatge" name="missatge" placeholder="El teu missatge..."></textarea>
            </div>
          </div>
        </form>

        <button class="enroll-btn" id="submitBtn" onclick="handleSubmit()">Enviar</button>
        <p class="sent-msg" id="sentMsg">✓ Missatge enviat!</p>

      </main>

      <footer class="footer">
        <div class="footer-inner">
          <h2 class="monlau">© 2026 Monlau</h2>
          <h2 class="poltica-de-privacitat">Política de Privacitat</h2>
        </div>
      </footer>

    </div>

    <script>
      function handleSubmit() {
        const form = document.getElementById('contactForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('sentMsg');

        // Clear all inputs
        form.querySelectorAll('input, textarea').forEach(el => el.value = '');

        // Show confirmation
        btn.style.display = 'none';
        msg.style.display = 'block';

        // Reset after 3 seconds
        setTimeout(() => {
          btn.style.display = '';
          msg.style.display = 'none';
        }, 3000);
      }
    </script>
  </body>
</html>
